<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password - WanderSync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="wrap"><a class="brand" href="index.html">WanderSync</a><nav id="nav"></nav></div></header>

  <main class="wrap">
    <div class="card narrow">
      <h1>Choose a new password</h1>
      <div id="msg" class="msg"></div>
      <form id="reset-form">
        <div class="field">
          <label for="password">New password (at least 6 characters)</label>
          <input id="password" type="password" minlength="6" required>
        </div>
        <button type="submit" id="submit-btn">Update password</button>
      </form>
      <p class="small"><a href="login.html">Back to login</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    renderNav();
    const msg = document.getElementById("msg");
    // The email link looks like  reset-password.html?token=XXXX
    const token = param("token");

    if (!token) {
      showMessage(msg, "This page needs the link from the reset email (the token is missing).", "error");
      document.getElementById("reset-form").classList.add("hidden");
    }

    document.getElementById("reset-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      const button = document.getElementById("submit-btn");
      button.disabled = true;
      showMessage(msg, "");
      try {
        const data = await api("/auth/reset-password", {
          method: "POST",
          auth: false,
          body: { token: token, new_password: document.getElementById("password").value },
        });
        showMessage(msg, data.message + " Redirecting to login...", "success");
        setTimeout(function () { window.location.href = "login.html"; }, 1800);
      } catch (err) {
        showMessage(msg, err.message, "error");
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
