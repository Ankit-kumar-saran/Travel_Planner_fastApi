<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password - WanderSync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="wrap"><a class="brand" href="index.html">WanderSync</a><nav id="nav"></nav></div></header>

  <main class="wrap">
    <div class="card narrow">
      <h1>Forgot password</h1>
      <p class="muted">Enter your email. If it is registered, we send a reset link that works for 30 minutes.</p>
      <div id="msg" class="msg"></div>
      <form id="forgot-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required>
        </div>
        <button type="submit" id="submit-btn">Send reset link</button>
      </form>
      <p class="small"><a href="login.html">Back to login</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    renderNav();
    const msg = document.getElementById("msg");

    document.getElementById("forgot-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      const button = document.getElementById("submit-btn");
      button.disabled = true;
      showMessage(msg, "");
      try {
        const data = await api("/auth/forgot-password", {
          method: "POST",
          auth: false,
          body: { email: document.getElementById("email").value.trim() },
        });
        showMessage(msg, data.message, "success");
      } catch (err) {
        showMessage(msg, err.message, "error");
      }
      button.disabled = false;
    });
  </script>
</body>
</html>
